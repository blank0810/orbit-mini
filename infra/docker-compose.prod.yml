# Production overlay for the tunnelled deployment at https://orbit.ehnand.com
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#
# It changes exactly two things: every service reads .env.prod instead of .env, and the web
# image is built with the public API base URL rather than the localhost one.
#
# Ports stay bound to 127.0.0.1. cloudflared runs alongside and reaches them over loopback,
# which is why nothing here publishes on 0.0.0.0. pgAdmin keeps running but the tunnel's
# ingress rules never route to it, so it stays unreachable from the internet.

# A SEPARATE stack: its own containers, own network, own volume, own database. Changes
# are built and checked on orbit-dev first; nothing here moves until it is deployed.
name: orbit-prod

services:
  db:
    env_file: ../.env.prod
    ports: !override ["127.0.0.1:7313:5432"]

  api:
    env_file: ../.env.prod
    ports: !override ["127.0.0.1:7312:8000"]

  web:
    env_file: ../.env.prod
    ports: !override ["127.0.0.1:7311:3000"]
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://orbit.ehnand.com

  pgadmin:
    env_file: ../.env.prod
    ports: !override ["127.0.0.1:7314:80"]

  # Present ONLY in the production overlay. The base compose file has no tunnel, so a
  # local `docker compose up` cannot expose the machine to the internet by accident.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # Runs as the host user that owns the credentials file, so that file can stay 0400.
    # The alternatives are worse: chmod 644 makes a tunnel credential readable by every
    # local account, and running as root inside the container to read a 0400 file trades
    # a real privilege boundary for a permission bit.
    user: "1000:1000"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # Read-only: the container needs the credentials and config, never to write them.
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
