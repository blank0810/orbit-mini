[project]
name = "orbit-mini-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pwdlib[argon2]",  # argon2id password hashing
    "pyjwt",  # stateless session token
    "fastapi",
    "stripe",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "email-validator",  # required by pydantic EmailStr
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    # starlette's TestClient transport. This starlette wants httpx2, not httpx.
    "httpx2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` lives at the project root, not on the default path.
pythonpath = ["."]
# Quiet by default; -v when a failure needs reading.
addopts = "-q"

[tool.vercel]
entrypoint = "app.main:app"
