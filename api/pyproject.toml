[project]
name = "orbit-mini-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pwdlib[argon2]",  # argon2id password hashing
    "pyjwt",  # stateless session token
    "fastapi",
    "stripe",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "email-validator",  # required by pydantic EmailStr
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
